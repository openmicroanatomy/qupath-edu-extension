plugins {
    id 'qupath-conventions'
    id 'idea'
    id("com.gradleup.shadow") version "9.6.1"
}

qupathExtension {
    name = "qupath-edu-extension"
    group = "qupath-edu"
    version = "1.0.4"
    description = "Use QuPath for learning!"
    automaticModule = "qupath.edu.EduExtension"
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

configurations {
    shadow
    compileOnly.extendsFrom(shadow)
    runtimeOnly.extendsFrom(shadow)
}

dependencies {
    implementation(libs.bundles.qupath)
    implementation(libs.bundles.logging)
    implementation(libs.guava)
    implementation(libs.qupath.fxtras)
    implementation(libs.bundles.logviewer)
    implementation(libs.extensionmanager)

    shadow "com.microsoft.azure:msal4j:1.25.1"
}

javadoc {
    enabled = false
}

shadowJar {
    duplicatesStrategy = DuplicatesStrategy.WARN
    archiveClassifier = ""
    configurations = [project.configurations.shadow]

    dependencies {
        // MSAL4J includes SLF4J which is included in QuPath
        exclude(dependency("org.slf4j:slf4j-api"))
    }
}
